x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      # No fallback here (unlike POSTGRES_USER/DB): a silently-applied
      # "password" default in prod means every container on the compose
      # network gets a DB with a known password if the env var is ever
      # forgotten at deploy time. Fail the deploy instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env for production}
      POSTGRES_DB: ${POSTGRES_DB:-gps_heatmap}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-gps_heatmap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # Each track upload's file bytes ride as a Celery task argument through
    # Redis (the broker) until a worker picks it up; without a cap, a burst
    # of large uploads (now rate-limited at the API too, see tracks.py/
    # poi.py's @limiter.limit) could otherwise grow Redis unbounded and take
    # down the broker + cache together. noeviction: fail new writes loudly
    # instead of silently dropping cache/queue data once the cap is hit.
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --forwarded-allow-ips='*': backend has no published port in prod (only
    # nginx does), so the only peer that can ever reach uvicorn directly is
    # the nginx container — trusting its X-Forwarded-For is safe here and
    # required for per-IP rate limiting (get_remote_address) to see real
    # client IPs instead of nginx's docker-network IP.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  celery_worker:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=1
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    ports:
      - "80:80"
      # - "443:443"  # TODO: enable once TLS certs are provisioned (see deploy/README.md)
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data_prod:
