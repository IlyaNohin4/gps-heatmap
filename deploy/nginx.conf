gzip on;
gzip_types text/plain text/css application/json application/javascript text/javascript;

client_max_body_size 25m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/OpenAPI docs are not proxied in production — the backend has no
    # published port either (see docker-compose.prod.yml), so /docs, /redoc
    # and /openapi.json are unreachable from outside the compose network.
    # Use them via the dev stack (docker-compose.yml, :8000) instead.

    location / {
        # Keep in sync with backend/app/main.py's _CSP_STRICT — this is the
        # SPA's own security headers; FastAPI's add_security_headers
        # middleware only covers /api/ JSON responses, not this static HTML.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://*.tile.opentopomap.org https://*.tile-cyclosm.openstreetmap.fr https://tile.waymarkedtrails.org https://server.arcgisonline.com https://*.googleapis.com https://*.gstatic.com https://mt1.google.com https://tile.openstreetmap.de; connect-src 'self' https://nominatim.openstreetmap.org https://overpass-api.de" always;
        try_files $uri /index.html;
    }
}
