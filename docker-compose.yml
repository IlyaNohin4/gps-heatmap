services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gps_heatmap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback only — this dev compose has no auth hardening
      # (default password, no Redis auth) and must never be reachable from
      # outside the host, including if it's ever brought up on a VDS.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-gps_heatmap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    # --concurrency=1 matches prod (docker-compose.prod.yml): without it,
    # prefork spawns one worker process per CPU, so multiple process_track
    # tasks can start concurrently and pile up blocking on `with
    # _semaphore:` (see process_track.py) — each one's soft_time_limit/
    # time_limit ticks from task start, including time spent waiting for
    # the lock, so a task can get hard-killed while still queued behind
    # another. With concurrency=1 the lock becomes a pure belt-and-suspenders
    # safety net instead of the actual serialization mechanism.
    command: watchmedo auto-restart -d /app -p '*.py' --recursive -- celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    # No env_file here: the frontend has no business holding backend secrets
    # (JWT_SECRET, DATABASE_URL, RESEND_API_KEY, ...). Vite loads its own
    # VITE_-prefixed vars from the bind-mounted frontend/.env below.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  mcp_server:
    build: ./mcp_server
    profiles:
      - mcp
    env_file: mcp_server/.env
    depends_on:
      - backend
    volumes:
      - ./mcp_server:/app
      - ./mcp_server/data:/data
    stdin_open: true
    tty: false
    command: python server.py

  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile.playwright
    profiles:
      - test
    depends_on:
      - frontend
      - backend
    environment:
      # Override baseURL so Playwright hits the Docker-network frontend service
      - PLAYWRIGHT_BASE_URL=http://frontend:5173
    volumes:
      # Mount source and tests; use the image's own node_modules (not host's)
      - ./frontend/src:/app/src
      - ./frontend/tests:/app/tests
      - ./frontend/playwright.config.ts:/app/playwright.config.ts
      - ./frontend/index.html:/app/index.html
    command: npx playwright test --reporter=list
    working_dir: /app

volumes:
  postgres_data:
  # Shared between backend and celery_worker so uploaded files can be
  # written to disk by one and read by the other (see Settings.UPLOAD_DIR) —
  # kept separate from the ./backend bind mount so uploaded files never land
  # in the git-tracked host directory.
  uploads_data:
